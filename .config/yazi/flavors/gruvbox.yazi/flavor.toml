# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[manager]
cwd = { fg = "#8ec07c" } # Gruvbox Aqua

# Hovered
hovered         = { fg = "#282828", bg = "#8ec07c", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#fabd2f", italic = true } # Yellow
find_position = { fg = "#fe8019", bg = "reset", italic = true } # Orange

# Marker
marker_selected = { fg = "#b8bb26", bg = "#b8bb26" } # Green
marker_copied   = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut      = { fg = "#fb4934", bg = "#fb4934" } # Red (standard Gruvbox muted red)

# Tab
tab_active   = { fg = "#282828", bg = "#a89984" }
tab_inactive = { fg = "#a89984", bg = "#3c3836" }

# Border
border_symbol = "│"
border_style  = { fg = "#665c54" }

# : }}}


# : Status {{{

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#3c3836", bg = "#3c3836" }

# Mode
mode_normal = { fg = "#282828", bg = "#8ec07c", bold = true } # Aqua
mode_select = { fg = "#282828", bg = "#fabd2f", bold = true } # Yellow
mode_unset  = { fg = "#282828", bg = "#d3869b", bold = true } # Purple

# Progress
progress_label  = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#504945", bg = "#3c3836" }
progress_error  = { fg = "#fb4934", bg = "#3c3836" }

# Permissions
permissions_t = { fg = "#83a598" } # Muted Gruvbox Blue
permissions_r = { fg = "#fabd2f" } # Yellow
permissions_w = { fg = "#fb4934" } # Red
permissions_x = { fg = "#b8bb26" } # Green
permissions_s = { fg = "#928374" } # Gray

# : }}}


# : Input {{{

[input]
border   = { fg = "#83a598" } # Muted Blue
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Select {{{

[select]
border   = { fg = "#83a598" } # Muted Blue
active   = { fg = "#fe8019" } # Orange
inactive = {}

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#83a598" } # Muted Blue
title   = {}
hovered = { underline = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#3c3836" }
cand            = { fg = "#8ec07c" } # Aqua
rest            = { fg = "#928374" }
desc            = { fg = "#fe8019" } # Orange
separator       = "  "
separator_style = { fg = "#504945" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#fe8019" } # Orange
exec    = { fg = "#8ec07c" } # Aqua
desc    = { fg = "#928374" }
hovered = { bg = "#504945", bold = true }
footer  = { fg = "#3c3836", bg = "#a89984" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Directories (Avoiding wallpaper teal, using Gruvbox Aqua)
	{ mime = "inode/directory", fg = "#8ec07c" },

	# Executables
	{ mime = "application/x-executable", fg = "#b8bb26" },

	# Media (Muted Purple/Gray)
	{ mime = "image/*", fg = "#d3869b" },
	{ mime = "video/*", fg = "#d3869b" },
	{ mime = "audio/*", fg = "#d3869b" },

	# Archives (Standard Orange)
	{ mime = "application/zip",             fg = "#fe8019" },
	{ mime = "application/gzip",            fg = "#fe8019" },
	{ mime = "application/x-tar",           fg = "#fe8019" },
	{ mime = "application/x-bzip",          fg = "#fe8019" },
	{ mime = "application/x-bzip2",         fg = "#fe8019" },
	{ mime = "application/x-7z-compressed", fg = "#fe8019" },
	{ mime = "application/x-rar",           fg = "#fe8019" },

	# Documents
	{ mime = "application/pdf",             fg = "#fabd2f" },
	{ mime = "text/*",                      fg = "#ebdbb2" },

	# Fallbacks (Strict new syntax: using mime = "*")
	{ mime = "*", fg = "#a89984" }
]

# : }}}
