# Lo-fi Cafe Neon theme for Yazi
# style: hard

[app]
overall = { bg = "#141721" }

[mgr]
cwd             = { fg = "#FCA652" }
hovered         = { fg = "#141721", bg = "#FCA652", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#F0EBD8", bg = "#FCA652", bold = true }
find_position = { fg = "#6CB4E6", bg = "reset", italic = true }

# Symlink
symlink_target = { fg = "#78A2EB", italic = true }

# Marker
marker_copied   = { fg = "#4EAB6E", bg = "#4EAB6E" }
marker_cut      = { fg = "#D45564", bg = "#D45564" }
marker_marked   = { fg = "#6CB4E6", bg = "#6CB4E6" }
marker_selected = { fg = "#FCA652", bg = "#FCA652" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#141721", bg = "#4EAB6E" }
count_cut      = { fg = "#141721", bg = "#D45564" }
count_selected = { fg = "#141721", bg = "#FCA652" }

# Border
border_symbol = "╎"
border_style  = { fg = "#323B52" }

[indicator]
current = { fg = "#141721", bg = "#FCA652", bold = true }
parent  = { fg = "#141721", bg = "#FCA652", bold = true }
preview = { fg = "#141721", bg = "#FCA652", underline = true }
padding = { open = "", close = "" }

[mode]
normal_main = { fg = "#141721", bg = "#FCA652", bold = true }
normal_alt  = { fg = "#FCA652", bg = "#323B52" }

select_main = { fg = "#141721", bg = "#D45564", bold = true }
select_alt  = { fg = "#D45564", bg = "#323B52" }

unset_main  = { fg = "#141721", bg = "#6CB4E6", bold = true }
unset_alt   = { fg = "#6CB4E6", bg = "#323B52" }

[tabs]
active    = { fg = "#141721", bg = "#FCA652" }
inactive  = { fg = "#78A2EB", bg = "#202636" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#F0EBD8", bold = true }
progress_normal = { fg = "#FCA652", bg = "#323B52" }
progress_error  = { fg = "#D45564", bg = "#323B52" }

perm_type  = { fg = "#FCA652" }
perm_read  = { fg = "#6CB4E6" }
perm_write = { fg = "#D45564" }
perm_exec  = { fg = "#4EAB6E" }
perm_sep   = { fg = "#323B52" }

[confirm]
border     = { fg = "#FCA652" }
title      = { fg = "#FCA652" }
body       = {}
list       = {}
btn_yes    = { fg = "#141721", bg = "#FCA652", bold = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#FCA652" }
title    = { fg = "#FCA652" }
tbl_col  = { fg = "#6CB4E6" }
tbl_cell = { fg = "#141721", bg = "#FCA652", bold = true }

[pick]
border   = { fg = "#FCA652" }
active   = { fg = "#141721", bg = "#FCA652", bold = true }
inactive = { fg = "#78A2EB" }

[input]
border   = { fg = "#FCA652" }
title    = { fg = "#FCA652" }
value    = {}
selected = { fg = "#141721", bg = "#FCA652" }

[cmp]
border      = { fg = "#FCA652" }
active      = { fg = "#141721", bg = "#FCA652" }
inactive    = {}
icon_file    = "  "
icon_folder  = "  "
icon_command = "  "

[tasks]
border  = { fg = "#FCA652" }
title   = { fg = "#FCA652" }
hovered = { fg = "#141721", bg = "#FCA652", bold = true }

[which]
cols            = 3
mask            = { bg = "#202636" }
cand            = { fg = "#6CB4E6" }
rest            = { fg = "#323B52" }
desc            = { fg = "#FCA652" }
separator       = "  "
separator_style = { fg = "#323B52" }

[help]
on      = { fg = "#6CB4E6" }
run     = { fg = "#FCA652" }
desc    = {}
hovered = { fg = "#141721", bg = "#FCA652", bold = true }
footer  = { fg = "#141721", bg = "#78A2EB" }

[notify]
title_info  = { fg = "#4EAB6E" }
title_warn  = { fg = "#6CB4E6" }
title_error = { fg = "#D45564" }
icon_info  = ""
icon_warn  = ""
icon_error = ""

[filetype]
rules = [
  # Directories
  { url = "*/", fg = "#FCA652" },

  # Media
  { mime = "image/*",          fg = "#6CB4E6" },
  { mime = "video/*",          fg = "#FCA652" },
  { mime = "audio/*",          fg = "#6CB4E6" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio}", fg = "#FCA652" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#6CB4E6" },

  # Code / Text
  { mime = "text/*",               fg = "#6CB4E6" },
  { mime = "application/json",     fg = "#6CB4E6" },
  { mime = "application/javascript", fg = "#FCA652" },
  { mime = "application/xml",      fg = "#6CB4E6" },

  # Special states
  { url = "*", is = "exec",   fg = "#4EAB6E" },
  { url = "*", is = "orphan", bg = "#D45564" },

  # Fallback
  { url = "*", fg = "#6CB4E6" },
]

[icon]
prepend_conds = [
  { if = "orphan", text = "", fg = "#D45564" },
  { if = "link",   text = "", fg = "#78A2EB" },
  { if = "block",  text = "", fg = "#6CB4E6" },
  { if = "char",   text = "", fg = "#6CB4E6" },
  { if = "fifo",   text = "", fg = "#6CB4E6" },
  { if = "sock",   text = "", fg = "#6CB4E6" },
  { if = "sticky", text = "", fg = "#6CB4E6" },
  { if = "dummy",  text = "", fg = "#D45564" },
  { if = "dir",    text = "", fg = "#FCA652" },
  { if = "exec",   text = "", fg = "#4EAB6E" },
  { if = "!dir",   text = "", fg = "#6CB4E6" },
]

prepend_exts = [
  { name = "js",   text = "", fg = "#FCA652" },
  { name = "ts",   text = "", fg = "#FCA652" },
  { name = "jsx",  text = "", fg = "#FCA652" },
  { name = "tsx",  text = "", fg = "#FCA652" },
  { name = "json", text = "", fg = "#6CB4E6" },
  { name = "toml", text = "", fg = "#6CB4E6" },
  { name = "yml",  text = "", fg = "#6CB4E6" },
  { name = "yaml", text = "", fg = "#6CB4E6" },
  { name = "md",   text = "", fg = "#78A2EB" },
  { name = "sh",   text = "", fg = "#4EAB6E" },
  { name = "py",   text = "", fg = "#6CB4E6" },
  { name = "rs",   text = "", fg = "#6CB4E6" },
  { name = "go",   text = "", fg = "#6CB4E6" },
  { name = "lua",  text = "", fg = "#6CB4E6" },
  { name = "zip",  text = "", fg = "#FCA652" },
  { name = "pdf",  text = "", fg = "#6CB4E6" },
  { name = "png",  text = "", fg = "#6CB4E6" },
  { name = "jpg",  text = "", fg = "#6CB4E6" },
  { name = "jpeg", text = "", fg = "#6CB4E6" },
  { name = "svg",  text = "  ", fg = "#6CB4E6" },
  { name = "mp4",  text = "", fg = "#FCA652" },
]

