# Color Scheme - Gruvbox Dark (Wallpaper Aligned)
background            #1a1a1a
foreground            #ebdbb2
selection_background  #665c54
selection_foreground  #ebdbb2

# Cursor colors
cursor                #8ec07c
cursor_text_color     #1a1a1a

# URL underline color when hovering over links
url_color             #fabd2f

# Window borders
active_border_color   #8ec07c
inactive_border_color #3c3836

# Tab bar
active_tab_background   #504945
active_tab_foreground   #ebdbb2
inactive_tab_background #282828
inactive_tab_foreground #a89984

# Terminal Colors (16 color Gruvbox palette)
# Black
color0  #282828
color8  #928374

# Red
color1  #cc241d
color9  #fb4934

# Green
color2  #98971a
color10 #b8bb26

# Yellow
color3  #d79921
color11 #fabd2f

# Blue
color4  #458588
color12 #83a598

# Magenta
color5  #b16286
color13 #d3869b

# Cyan (Gruvbox Aqua)
color6  #689d6a
color14 #8ec07c

# White
color7  #a89984
color15 #ebdbb2

# Window padding & Opacity
window_padding_width 0
resize_in_steps no
background_opacity 0.90
confirm_os_window_close 0

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 19.0
shell /bin/zsh
