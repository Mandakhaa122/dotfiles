# Color Scheme - Lo-Fi Neon Night
background            #141824
foreground            #dbe4ff
selection_background  #1d2333
selection_foreground  #00e5ff

# Cursor colors
cursor                #00e5ff
cursor_text_color     #141824

# URL underline color when hovering over links
url_color             #ffe600

# Window borders
active_border_color   #00e5ff
inactive_border_color #1d2333

# Tab bar
active_tab_background   #00e5ff
active_tab_foreground   #141824
inactive_tab_background #1d2333
inactive_tab_foreground #5c6b8f

# Terminal Colors (16 color palette)
# Black
color0  #141824
color8  #3a445d

# Red
color1  #ff5555
color9  #ff7777

# Green
color2  #00e5ff
color10 #50fa7b

# Yellow
color3  #ffe600
color11 #ffffa5

# Blue
color4  #5f87ff
color12 #92b0ff

# Magenta
color5  #e056fd
color13 #f093fb

# Cyan
color6  #00d2ff
color14 #80e5ff

# White
color7  #dbe4ff
color15 #ffffff

# Window padding & Opacity
window_padding_width 0
resize_in_steps no
background_opacity 0.90
confirm_os_window_close 0


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 19.0
shell /bin/zsh

